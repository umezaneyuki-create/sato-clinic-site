<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="佐藤医院のWeb予約で、予約日時を選択する画面です。">
  <title>予約日時の選択 | 佐藤医院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261102-common-header">
  <link rel="stylesheet" href="css/booking.css?v=20261102-9">
  <script src="js/script.js" defer></script>
  <script src="js/booking-date.js" defer></script>
</head>
<body class="booking-page">
  <div class="site-bg" aria-hidden="true"></div>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="佐藤医院 トップへ">
        <img src="assets/images/logo.png" alt="佐藤医院 Sato Clinic">
      </a>
      <button class="menu-toggle" type="button" aria-controls="global-nav" aria-expanded="false">
        <span class="menu-toggle__line"></span><span class="menu-toggle__line"></span><span class="menu-toggle__line"></span>
        <span class="sr-only">メニューを開く</span>
      </button>
      <div class="header-right">
        <nav class="global-nav" id="global-nav" aria-label="グローバルナビゲーション">
          <a href="index.html">トップ</a>
          <a href="info.html">お知らせ</a>
          <a href="kamoku.html">診療内容</a>
          <a href="about.html">当院について</a>
          <a href="access.html?v=20261102-common-header">診療時間・所在地</a>
          <a href="faq.html?v=20261102-common-header">よくあるご質問</a>
        </nav>
        <div class="header-contact-stack">
          <a class="header-phone" href="tel:0000000000"><img class="header-contact-icon" src="assets/images/phone.svg" alt=""><img src="assets/images/telno.png" alt="電話番号 00-0000-0000"></a>
          <a class="header-inquiry-button" href="inquiry.html"><span class="header-inquiry-icon"><img src="assets/images/mail.svg" alt=""></span><span>メールで問い合わせる</span></a>
        </div>
        <a class="reserve-button" href="booking.html" aria-current="page">Web予約はこちら</a>
      </div>
    </div>
  </header>

  <main class="booking-main booking-date-main">
    <section class="booking-intro" aria-labelledby="booking-date-title">
      <ol class="booking-steps" aria-label="予約の流れ">
        <li>
          <span class="booking-step-icon" aria-hidden="true"><img src="assets/images/icon-calendar-check.png" alt=""></span>
          <span class="booking-step-number">1</span><span class="booking-step-label">予約種別を選ぶ</span>
        </li>
        <li class="is-current" aria-current="step">
          <span class="booking-step-icon" aria-hidden="true"><img src="assets/images/icon-calendar-clock.png" alt=""></span>
          <span class="booking-step-number">2</span><span class="booking-step-label">日時を選ぶ</span>
        </li>
        <li>
          <span class="booking-step-icon" aria-hidden="true"><img src="assets/images/icon-pencil.png" alt=""></span>
          <span class="booking-step-number">3</span><span class="booking-step-label">情報を入力</span>
        </li>
        <li>
          <span class="booking-step-icon" aria-hidden="true"><img src="assets/images/checkcircle.png" alt=""></span>
          <span class="booking-step-number">4</span><span class="booking-step-label">予約の確認</span>
        </li>
      </ol>
      <div class="booking-heading">
        <h1 id="booking-date-title">予約日時の選択</h1>
        <p class="booking-lead"><span id="booking-type-label">診療予約（一般診療）</span></p>
      </div>
    </section>

    <section class="booking-date-panel" aria-labelledby="booking-date-panel-title">
      <h2 id="booking-date-panel-title" class="sr-only">予約日時を選択してください</h2>
      <div class="booking-date-tabs" role="tablist" aria-label="日付の選び方">
        <button class="is-active" id="calendar-tab" type="button" role="tab" aria-selected="true" aria-controls="booking-calendar">カレンダーで選ぶ</button>
        <button id="date-filter-tab" type="button" role="tab" aria-selected="false" aria-controls="booking-calendar">日付で絞り込む</button>
      </div>

      <div class="booking-calendar" id="booking-calendar" role="tabpanel" aria-labelledby="calendar-tab">
        <div class="booking-calendar-grid">
          <div class="booking-calendar-header">
            <button class="booking-month-button" id="booking-month-prev" type="button" aria-label="前の月">‹</button>
            <h3 id="booking-month-label" aria-live="polite"></h3>
            <button class="booking-month-button" id="booking-month-next" type="button" aria-label="次の月">›</button>
          </div>
          <div class="booking-weekdays" aria-hidden="true">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div class="booking-calendar-days" id="booking-calendar-days" role="group" aria-label="予約日"></div>
        </div>

        <div class="booking-time-panel">
          <label class="booking-time-label" for="booking-time-band">時間帯を選択してください</label>
          <select id="booking-time-band" name="time-band">
            <option value="am">午前（9:00〜12:00）</option>
            <option value="pm">午後（13:00〜18:00）</option>
          </select>
          <div class="booking-time-slots" id="booking-time-slots" role="group" aria-label="予約時間"></div>
          <div class="booking-time-legend" aria-label="時間枠の凡例">
            <span><i class="is-available" aria-hidden="true"></i>選択できます</span>
            <span><i class="is-unavailable" aria-hidden="true"></i>選択できません（満員・受付終了）</span>
          </div>
        </div>
      </div>

      <div class="booking-date-actions">
        <a class="booking-date-back" href="booking.html">戻る</a>
        <button class="booking-date-next" type="button" disabled>次へ（予約情報の入力）<span aria-hidden="true">›</span></button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner"><small>© 2026 佐藤医院. All Rights Reserved.</small><a href="privacy-policy.html">プライバシーポリシー</a></div>
  </footer>
</body>
</html>
