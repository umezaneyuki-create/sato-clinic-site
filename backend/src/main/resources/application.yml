spring:
  application:
    name: sato-clinic-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sato_clinic?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:sato_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  address: 127.0.0.1
  port: 8080

clinic:
  inquiry:
    notification-email: ${CLINIC_NOTIFICATION_EMAIL:info@sato-clinic-test.jp}
    from-email: ${MAIL_FROM:info@sato-clinic-test.jp}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:clinic-demo-change-me}
