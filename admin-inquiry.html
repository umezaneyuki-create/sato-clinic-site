<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="佐藤医院 お問い合わせ管理">
  <title>お問い合わせ管理 | 佐藤医院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=20260910-1">
  <link rel="stylesheet" href="css/admin-inquiry.css?v=20261102-draft-save-redirect">
  <script src="js/inquiry-data.js?v=20261102-draft-save-redirect" defer></script>
  <script src="js/admin-auth.js" defer></script>
  <script src="js/admin-inquiry.js?v=20261102-draft-save-redirect" defer></script>
</head>
<body class="admin-dashboard">
  <div class="admin-layout">
    <aside class="admin-sidebar" aria-label="管理者メニュー">
      <a class="admin-brand" href="admin-top.html">
        <img src="assets/images/logo.png" alt="佐藤医院 Sato Clinic">
        <span>管理者システム</span>
      </a>

      <nav class="admin-sidebar-nav">
        <section class="admin-nav-group">
          <a class="admin-nav-heading" href="admin-info.html">
            <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Zm12.5 1.1a4 4 0 0 1 0 3.8M17.7 7.3a8 8 0 0 1 0 9.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>お知らせ管理</span>
          </a>
          <div class="admin-nav-items">
            <a href="admin-info.html"><span class="admin-dot"></span>お知らせ一覧</a>
            <a href="admin-info-new.html"><span class="admin-dot"></span>新規作成</a>
            <a href="admin-info.html#news-list"><span class="admin-dot"></span>編集</a>
            <a href="admin-info.html?bulk=1#news-list"><span class="admin-dot"></span>一括公開／非公開</a>
          </div>
        </section>

        <section class="admin-nav-group">
          <a class="admin-nav-heading is-active" href="admin-inquiry.html" aria-current="page">
            <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>問い合わせ管理</span>
          </a>
          <div class="admin-nav-items">
            <a href="admin-inquiry.html#inquiry-list"><span class="admin-dot"></span>問い合わせ一覧</a>
            <a href="admin-inquiry.html?view=sent#inquiry-list"><span class="admin-dot"></span>送信済みメッセージ</a>
            <a href="admin-inquiry.html?view=drafts#inquiry-list"><span class="admin-dot"></span>下書きメッセージ</a>
            <a href="admin-inquiry.html?view=deleted#inquiry-list"><span class="admin-dot"></span>削除済みメッセージ</a>
          </div>
        </section>

        <section class="admin-nav-group">
          <a class="admin-nav-heading" href="admin-top.html#today-reservations">
            <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M4 9h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 13h3v3H8z" fill="currentColor"/></svg>
            <span>予約管理</span>
          </a>
          <div class="admin-nav-items">
            <a href="admin-top.html#today-reservations"><span class="admin-dot"></span>予約一覧・予約状況管理</a>
            <a href="admin-top.html#today-reservations"><span class="admin-dot"></span>予約枠管理</a>
          </div>
        </section>
      </nav>

      <a class="admin-sidebar-promo" href="index.html">
        <span>地域に根ざした医療</span>
        <img src="assets/images/hospital_2.jpg" alt="佐藤医院の外観">
        <strong><img src="assets/images/logo.png" alt="佐藤医院 Sato Clinic"></strong>
      </a>
    </aside>

    <div class="admin-shell">
      <header class="admin-topbar">
        <div class="admin-topbar-actions">
          <button class="admin-notification" type="button" aria-label="通知 1件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.4-2.2V10a4.6 4.6 0 0 0-9.2 0v4.8L6 17Zm4 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>1</span>
          </button>
          <span class="admin-topbar-divider" aria-hidden="true"></span>
          <button class="admin-account" type="button">佐藤医院 管理者 <span aria-hidden="true">⌄</span></button>
          <a class="admin-logout" href="admin.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>ログアウト</a>
        </div>
      </header>

      <main class="admin-main admin-inquiry-main">
        <div class="admin-heading-row admin-inquiry-heading-row">
          <div>
            <h1><img src="assets/images/reaf.png" alt="">お問い合わせ管理</h1>
            <p class="admin-inquiry-lead">お問い合わせの一覧確認・検索・返信・対応状況の管理を行えます。</p>
          </div>
          <button class="admin-inquiry-new" id="show-unhandled" type="button"><span aria-hidden="true">＋</span>新問い合わせを確認</button>
        </div>

        <p class="admin-inquiry-feedback" id="inquiry-feedback" role="status" aria-live="polite" hidden></p>

        <section class="admin-inquiry-stats" aria-label="お問い合わせ集計">
          <article class="admin-inquiry-stat">
            <span class="inquiry-stat-icon"><img src="assets/images/icon_allinfo.png" alt=""></span>
            <span><b>全件数</b><strong><span data-stat="all">6</span><small>件</small></strong></span>
          </article>
          <article class="admin-inquiry-stat">
            <span class="inquiry-stat-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="11" width="36" height="26" rx="4"/><path d="m8 14 16 13 16-13"/></svg></span>
            <span><b>未対応</b><strong><span data-stat="unhandled">2</span><small>件</small></strong></span>
          </article>
          <article class="admin-inquiry-stat is-complete">
            <span class="inquiry-stat-icon"><img src="assets/images/checkcircle.png" alt=""></span>
            <span><b>対応済み</b><strong><span data-stat="done">2</span><small>件</small></strong></span>
          </article>
        </section>

        <form class="admin-inquiry-filters" id="inquiry-filters">
          <label class="inquiry-filter-keyword">キーワード検索
            <span class="inquiry-search-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.4 4.4"/></svg><input type="search" name="q" placeholder="氏名・メール・内容で検索"></span>
          </label>
          <label>お問い合わせ種別<select name="category"><option value="">すべて</option><option>診療について</option><option>予防接種</option><option>健康診断</option><option>予約について</option><option>その他</option></select></label>
          <label>対応状況<select name="status"><option value="">すべて</option><option>未対応</option><option>対応中</option><option>対応済み</option></select></label>
          <label class="inquiry-filter-sort">並び順<select name="sort"><option value="newest">受付日 新しい順</option><option value="oldest">受付日 古い順</option></select></label>
          <button class="admin-search-button" type="submit"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.4 4.4"/></svg></span>検索</button>
          <button class="admin-reset-button" type="reset">リセット</button>
        </form>

        <section class="admin-panel admin-inquiry-list-panel" id="inquiry-list" aria-labelledby="inquiry-list-title">
          <div class="admin-panel-heading inquiry-list-heading">
            <div class="inquiry-list-heading-copy">
              <h2 id="inquiry-list-title"><span class="admin-panel-icon inquiry-leaf-icon"><img src="assets/images/reaf.png" alt=""></span>お問い合わせ一覧</h2>
              <p id="inquiry-sort-label">受付日の新しい順で表示中</p>
            </div>
          </div>
          <div class="admin-table-wrap inquiry-table-wrap">
            <table class="admin-table admin-inquiry-table">
              <thead><tr><th id="inquiry-date-heading">受付日</th><th>氏名</th><th>お問い合わせ種別</th><th>件名</th><th>対応状況</th><th>返信状況</th><th>操作</th></tr></thead>
              <tbody id="inquiry-table-body">
                <tr><td colspan="7" class="inquiry-empty">読み込み中です。</td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-info-pagination-row inquiry-pagination-row">
            <span id="inquiry-count" aria-live="polite">—</span>
            <nav class="admin-info-pagination" id="inquiry-pagination" aria-label="お問い合わせ一覧ページ"></nav>
          </div>
        </section>
      </main>
    </div>
  </div>

</body>
</html>
